<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Pi - Web UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1a1a1a;
            --text-primary: #e5e5e5;
            --text-secondary: #888;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --border: #2a2a2a;
            --user-bg: #1e293b;
            --assistant-bg: #1a1a1a;
            --tool-bg: #0f172a;
            --error-bg: #450a0a;
            --success-bg: #052e16;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        /* Session selector */
        .session-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .session-input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 150px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
        }

        /* Chat container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 16px;
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.6;
        }

        .message-user {
            background: var(--user-bg);
        }

        .message-assistant {
            background: var(--assistant-bg);
            border: 1px solid var(--border);
        }

        .message-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-content code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 14px;
        }

        .message-content pre {
            background: var(--bg-tertiary);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message-content pre code {
            background: none;
            padding: 0;
        }

        /* Tool result */
        .tool-result {
            background: var(--tool-bg);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
        }

        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .tool-name {
            font-weight: 600;
            color: var(--accent);
        }

        .tool-status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .tool-status.success {
            background: var(--success-bg);
            color: #4ade80;
        }

        .tool-status.error {
            background: var(--error-bg);
            color: #f87171;
        }

        /* Reasoning */
        .reasoning {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent);
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Input area */
        .input-area {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-field {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 16px;
            padding-right: 80px;
            border-radius: 12px;
            font-size: 15px;
            resize: none;
            min-height: 48px;
            max-height: 200px;
            line-height: 1.5;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent);
        }

        .send-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stop-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .stop-btn:hover {
            background: #dc2626;
        }

        /* Options */
        .options {
            max-width: 800px;
            margin: 0 auto 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .option-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .option-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        /* Loading indicator */
        .loading {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 16px;
        }

        /* Scrollbar */
        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">π</div>
            <div class="title">Embedded Pi</div>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
        <div class="session-controls">
            <input type="text" class="session-input" id="sessionId" value="default" placeholder="Session ID">
            <button class="btn btn-secondary" id="clearBtn" title="Clear history">Clear</button>
        </div>
    </div>

    <!-- Chat -->
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="empty-state">
                <h2>Welcome to Embedded Pi</h2>
                <p>Enter a message below to start chatting with the AI agent.</p>
            </div>
        </div>

        <!-- Input area -->
        <div class="input-area">
            <div class="options">
                <div class="option-group">
                    <label class="option-label">Provider</label>
                    <select class="option-select" id="provider">
                        <option value="volcengine-coding" selected>火山引擎</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="openai">OpenAI</option>
                        <option value="groq">Groq</option>
                    </select>
                </div>
                <div class="option-group">
                    <label class="option-label">Model</label>
                    <select class="option-select" id="model">
                        <option value="doubao-seed-2.0-code" selected>Doubao Seed 2.0 Code</option>
                        <option value="claude-sonnet-4-20250514">Claude Sonnet</option>
                        <option value="claude-opus-4-5">Claude Opus</option>
                        <option value="gpt-4o">GPT-4o</option>
                    </select>
                </div>
                <div class="option-group">
                    <label class="option-label">Thinking</label>
                    <select class="option-select" id="thinkingLevel">
                        <option value="off">Off</option>
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
            </div>
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea class="input-field" id="promptInput" placeholder="Type your message..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" disabled>Send</button>
                    <button class="stop-btn" id="stopBtn" style="display: none;">Stop</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket client
        class EmbeddedPiClient {
            constructor() {
                this.ws = null;
                this.sessionId = 'default';
                this.isConnected = false;
                this.isLoading = false;
                this.messageId = 0;
                this.pendingRequests = new Map();
                this.currentAssistantMessage = null;
                this.currentReasoningElement = null;

                this.initElements();
                this.initEventListeners();
                this.connect();
            }

            initElements() {
                this.statusDot = document.getElementById('statusDot');
                this.statusText = document.getElementById('statusText');
                this.messagesContainer = document.getElementById('messages');
                this.promptInput = document.getElementById('promptInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.sessionIdInput = document.getElementById('sessionId');
                this.clearBtn = document.getElementById('clearBtn');
                this.providerSelect = document.getElementById('provider');
                this.modelSelect = document.getElementById('model');
                this.thinkingLevelSelect = document.getElementById('thinkingLevel');
            }

            initEventListeners() {
                // Send button
                this.sendBtn.addEventListener('click', () => this.sendPrompt());

                // Stop button
                this.stopBtn.addEventListener('click', () => this.stopGeneration());

                // Enter to send (Shift+Enter for new line)
                this.promptInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendPrompt();
                    }
                });

                // Auto-resize textarea
                this.promptInput.addEventListener('input', () => {
                    this.promptInput.style.height = 'auto';
                    this.promptInput.style.height = Math.min(this.promptInput.scrollHeight, 200) + 'px';
                    this.sendBtn.disabled = !this.promptInput.value.trim() || this.isLoading || !this.isConnected;
                });

                // Session ID change
                this.sessionIdInput.addEventListener('change', () => {
                    this.sessionId = this.sessionIdInput.value.trim() || 'default';
                    this.clearMessages();
                    if (this.isConnected) {
                        this.subscribe();
                        this.getHistory();
                    }
                });

                // Clear button
                this.clearBtn.addEventListener('click', () => {
                    this.clearMessages();
                    this.fetch('/api/sessions/' + this.sessionId + '/clear', { method: 'POST' });
                });
            }

            connect() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws`;

                this.updateStatus('connecting', 'Connecting...');

                this.ws = new WebSocket(wsUrl);

                this.ws.onopen = () => {
                    this.updateStatus('connected', 'Connected');
                    this.isConnected = true;
                    this.subscribe();
                    this.getHistory();
                    this.sendBtn.disabled = !this.promptInput.value.trim();
                };

                this.ws.onclose = () => {
                    this.updateStatus('disconnected', 'Disconnected');
                    this.isConnected = false;
                    this.sendBtn.disabled = true;

                    // Reconnect after delay
                    setTimeout(() => this.connect(), 3000);
                };

                this.ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    this.updateStatus('error', 'Error');
                };

                this.ws.onmessage = (event) => {
                    this.handleMessage(JSON.parse(event.data));
                };
            }

            updateStatus(state, text) {
                this.statusDot.className = 'status-dot';
                if (state === 'connected') {
                    this.statusDot.classList.add('connected');
                }
                this.statusText.textContent = text;
            }

            subscribe() {
                this.send({
                    type: 'subscribe',
                    data: { sessionId: this.sessionId }
                });
            }

            getHistory() {
                const id = ++this.messageId;
                this.send({
                    type: 'get_history',
                    data: { sessionId: this.sessionId },
                    id: String(id)
                });
            }

            sendPrompt() {
                const prompt = this.promptInput.value.trim();
                if (!prompt || this.isLoading || !this.isConnected) return;

                this.isLoading = true;
                this.sendBtn.disabled = true;
                this.sendBtn.style.display = 'none';
                this.stopBtn.style.display = 'block';

                // Add user message
                this.addMessage('user', prompt);
                this.promptInput.value = '';
                this.promptInput.style.height = 'auto';

                // Create placeholder for assistant message
                this.currentAssistantMessage = this.addMessage('assistant', '');
                this.currentAssistantMessage.innerHTML = `
                    <div class="message-label">Assistant</div>
                    <div class="message-content">
                        <span class="loading"><span class="spinner"></span> Thinking...</span>
                    </div>
                `;

                // Reset reasoning element
                this.currentReasoningElement = null;

                const id = ++this.messageId;
                this.send({
                    type: 'prompt',
                    data: {
                        sessionId: this.sessionId,
                        prompt,
                        provider: this.providerSelect.value,
                        model: this.modelSelect.value,
                        thinkingLevel: this.thinkingLevelSelect.value
                    },
                    id: String(id)
                });
            }

            stopGeneration() {
                if (!this.isLoading) return;
                this.send({
                    type: 'stop',
                    data: { sessionId: this.sessionId }
                });
            }

            send(message) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(message));
                }
            }

            handleMessage(message) {
                switch (message.type) {
                    case 'connected':
                        console.log('Connected:', message.data);
                        break;

                    case 'pong':
                        break;

                    case 'history':
                        this.renderHistory(message.data.messages);
                        break;

                    case 'partial_reply':
                        if (this.currentAssistantMessage) {
                            this.currentAssistantMessage.innerHTML = `
                                <div class="message-label">Assistant</div>
                                <div class="message-content">${this.escapeHtml(message.data.text)}</div>
                            `;
                        }
                        break;

                    case 'reasoning_stream':
                        this.addReasoning(message.data.text);
                        break;

                    case 'tool_result':
                        this.addToolResult(message.data);
                        break;

                    case 'block_reply':
                        if (this.currentAssistantMessage) {
                            this.currentAssistantMessage.innerHTML = `
                                <div class="message-label">Assistant</div>
                                <div class="message-content">${this.formatMessage(message.data.text)}</div>
                            `;
                        }
                        this.isLoading = false;
                        this.sendBtn.disabled = !this.promptInput.value.trim();
                        this.sendBtn.style.display = 'block';
                        this.stopBtn.style.display = 'none';
                        this.currentAssistantMessage = null;
                        this.currentReasoningElement = null;
                        break;

                    case 'success':
                        if (this.pendingRequests.has(message.id)) {
                            const callback = this.pendingRequests.get(message.id);
                            callback?.(message.data);
                            this.pendingRequests.delete(message.id);
                        }
                        break;

                    case 'error':
                        console.error('Error:', message.data);
                        this.addMessage('system', 'Error: ' + message.data.message, true);
                        this.isLoading = false;
                        this.sendBtn.disabled = !this.promptInput.value.trim();
                        this.sendBtn.style.display = 'block';
                        this.stopBtn.style.display = 'none';
                        this.currentAssistantMessage = null;
                        this.currentReasoningElement = null;
                        break;
                }

                this.scrollToBottom();
            }

            renderHistory(messages) {
                if (messages.length === 0) return;

                this.clearMessages(false);

                for (const msg of messages) {
                    this.addMessage(msg.role, msg.content);
                }
            }

            addMessage(role, content, isError = false) {
                const emptyState = this.messagesContainer.querySelector('.empty-state');
                if (emptyState) {
                    emptyState.remove();
                }

                const div = document.createElement('div');
                div.className = `message message-${role}`;

                const label = role === 'user' ? 'You' : role.charAt(0).toUpperCase() + role.slice(1);

                div.innerHTML = `
                    <div class="message-label">${label}</div>
                    <div class="message-content">${this.formatMessage(content)}</div>
                `;

                this.messagesContainer.appendChild(div);
                this.scrollToBottom();
                return div;
            }

            addReasoning(text) {
                if (!this.currentReasoningElement) {
                    const emptyState = this.messagesContainer.querySelector('.empty-state');
                    if (emptyState) {
                        emptyState.remove();
                    }
                    const div = document.createElement('div');
                    div.className = 'reasoning';
                    this.currentReasoningElement = div;
                    this.messagesContainer.appendChild(div);
                }
                this.currentReasoningElement.textContent = text;
                this.scrollToBottom();
            }

            addToolResult(tool) {
                const div = document.createElement('div');
                div.className = 'tool-result';
                div.innerHTML = `
                    <div class="tool-header">
                        <span class="tool-name">${this.escapeHtml(tool.name)}</span>
                        <span class="tool-status ${tool.isError ? 'error' : 'success'}">
                            ${tool.isError ? 'Error' : 'Success'}
                        </span>
                    </div>
                    <div class="tool-content">
                        <strong>Parameters:</strong>
                        <pre>${JSON.stringify(tool.parameters, null, 2)}</pre>
                        ${tool.result ? `
                            <strong>Result:</strong>
                            <pre>${typeof tool.result === 'string' ? tool.result : JSON.stringify(tool.result, null, 2)}</pre>
                        ` : ''}
                    </div>
                `;
                this.messagesContainer.appendChild(div);
            }

            clearMessages(showEmpty = true) {
                this.messagesContainer.innerHTML = '';
                if (showEmpty) {
                    this.messagesContainer.innerHTML = `
                        <div class="empty-state">
                            <h2>Welcome to Embedded Pi</h2>
                            <p>Enter a message below to start chatting with the AI agent.</p>
                        </div>
                    `;
                }
            }

            formatMessage(text) {
                if (!text) return '';

                // Simple markdown-like formatting
                return this.escapeHtml(text)
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\n/g, '<br>');
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            scrollToBottom() {
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }

            async fetch(url, options = {}) {
                try {
                    const response = await fetch(url, options);
                    return await response.json();
                } catch (error) {
                    console.error('Fetch error:', error);
                    return null;
                }
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            new EmbeddedPiClient();
        });
    </script>
</body>
</html>
